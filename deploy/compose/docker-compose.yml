# Local middleware for crypto-trading. Start it through scripts/dev.sh, which passes
# --env-file .env.local (secrets) and the requested profiles.
#
# Profiles (design.md 10.2):
#   core  PostgreSQL + TimescaleDB, Redis, Nacos, Vault, Keycloak (P1-T01)
#   mq    Kafka, Apicurio, Kafka UI                       (P3)
#   obs   Prometheus, Grafana (P0-T07); OTel Collector, Tempo, Loki, Alloy in P8
#   mock  alpaca-mock                                     (P2)
#
# All images are pinned and support linux/arm64. Ports are published on 127.0.0.1 only.
# Memory settings follow design.md 10.1.
name: crypto-trading

services:
  postgres:
    # PostgreSQL 18.7 + TimescaleDB 2.32.1 (non "-oss" build: continuous aggregates are needed).
    image: timescale/timescaledb:2.32.1-pg18
    profiles: [core]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.local}
      POSTGRES_DB: crypto
      # Keep our own memory settings instead of the image's timescaledb-tune.
      NO_TS_TUNE: "true"
      TIMESCALEDB_TELEMETRY: "off"
      DB_PASSWORD_ACCOUNT: ${DB_PASSWORD_ACCOUNT:?set in .env.local}
      DB_PASSWORD_MARKET: ${DB_PASSWORD_MARKET:?set in .env.local}
      DB_PASSWORD_ORDER: ${DB_PASSWORD_ORDER:?set in .env.local}
      DB_PASSWORD_LEDGER: ${DB_PASSWORD_LEDGER:?set in .env.local}
      DB_PASSWORD_STRATEGY: ${DB_PASSWORD_STRATEGY:?set in .env.local}
      DB_PASSWORD_AUDIT: ${DB_PASSWORD_AUDIT:?set in .env.local}
      DB_PASSWORD_KEYCLOAK: ${DB_PASSWORD_KEYCLOAK:?set in .env.local}
      DB_PASSWORD_APICURIO: ${DB_PASSWORD_APICURIO:?set in .env.local}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - timescaledb.max_background_workers=4
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Mounted file by file: the image already ships its own init scripts in this directory.
      - ./postgres/init/10-service-schemas.sh:/docker-entrypoint-initdb.d/10-service-schemas.sh:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crypto"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.8.4-alpine
    profiles: [core]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set in .env.local}
    command:
      - sh
      - -c
      # noeviction: rate-limit buckets, locks and leases must never be evicted silently.
      - exec redis-server --requirepass "$$REDISCLI_AUTH" --maxmemory 128mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nacos:
    image: nacos/nacos-server:v3.3.0
    profiles: [core]
    environment:
      # Standalone mode with the embedded storage (no external database).
      MODE: standalone
      # Nacos 3 runs the console as a separate app (default 8080, which is the gateway's port).
      NACOS_CONSOLE_PORT: "8849"
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?set in .env.local}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?set in .env.local}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?set in .env.local}
      # Only naming + config; the AI registry modules are not loaded.
      FUNCTION_MODE: microservice
      JVM_XMS: 384m
      JVM_XMX: 384m
      JVM_XMN: 128m
      # The startup script only sets heap flags in standalone mode, and JAVA_OPT_EXT is passed
      # after -jar (as program arguments), so non-heap limits go through JAVA_TOOL_OPTIONS.
      # ~270 threads: cap glibc malloc arenas, otherwise native memory grows past the limit.
      MALLOC_ARENA_MAX: "2"
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseSerialGC
        -XX:MaxMetaspaceSize=192m
        -XX:ReservedCodeCacheSize=64m
        -XX:MaxDirectMemorySize=64m
        -Xss512k
      TIME_ZONE: UTC
    ports:
      - "127.0.0.1:8848:8848"   # server API (context path /nacos)
      - "127.0.0.1:8849:8849"   # console UI
      - "127.0.0.1:9848:9848"   # gRPC (clients)
    volumes:
      - nacos-data:/home/nacos/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v3/admin/core/state/liveness >/dev/null && curl -fs http://localhost:8849/v3/console/health/liveness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: [core]
    # Development mode (design.md 10.1) with PostgreSQL schema `keycloak`. The realm file is imported
    # on start only when the realm does not exist yet; placeholders like ${KEYCLOAK_DEV_ALICE_PASSWORD}
    # are replaced by Keycloak from the environment, so no secret is in the repository.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/crypto
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_PASSWORD_KEYCLOAK:?set in .env.local}
      KC_HTTP_PORT: "8180"
      # Tokens always carry the issuer http://localhost:8180/realms/crypto-trading (what browsers and
      # services on the host use); containers may still call http://keycloak:8180 for back-channel requests.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Admin of the `master` realm (Keycloak admin console).
      KC_BOOTSTRAP_ADMIN_USERNAME: kc-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env.local}
      JAVA_OPTS_KC_HEAP: -Xms384m -Xmx384m
      # Values substituted into the realm import file.
      KEYCLOAK_DEV_ADMIN_PASSWORD: ${KEYCLOAK_DEV_ADMIN_PASSWORD:?set in .env.local}
      KEYCLOAK_DEV_ALICE_PASSWORD: ${KEYCLOAK_DEV_ALICE_PASSWORD:?set in .env.local}
      GRAFANA_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:?set in .env.local}
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ../keycloak/realm-crypto-trading.json:/opt/keycloak/data/import/realm-crypto-trading.json:ro
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl / wget: talk HTTP to the management port (9000) through bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"status": *"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  vault:
    image: hashicorp/vault:2.2.2
    profiles: [core]
    # Dev mode: in-memory, auto-unsealed, root token from .env.local. Data is lost on restart.
    command: ["server", "-dev"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:?set in .env.local}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      SKIP_SETCAP: "true"
    ports:
      - "127.0.0.1:8200:8200"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Short retention for the 16GB machine (design.md 10.1).
      - --storage.tsdb.retention.time=2d
    environment:
      # Soft limit for the Go runtime, below the container limit.
      GOMEMLIMIT: 320MiB
    # Services run on the host (IDE / bootRun); targets are host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:13.3.1
    profiles: [obs]
    environment:
      # Local admin account until P1-T08 switches Grafana to Keycloak single sign-on.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env.local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/service-instances.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Data source and dashboards are provisioned from the repository on every start.
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # ~240 MiB of process memory after start (P0-T07); 512m leaves room for page cache and growth.
    mem_limit: 512m
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  nacos-data:
  prometheus-data:
  grafana-data:
