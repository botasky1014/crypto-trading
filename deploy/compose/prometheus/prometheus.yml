# Prometheus for the local Compose environment (profile `obs`).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot services running on the host (IDE / bootRun). One file entry per service:
  # add a target to targets/services.json when a service is added (picked up without restart).
  - job_name: services
    metrics_path: /actuator/prometheus
    # Keep the `instance` tag that every service sets itself (common-observability) instead of
    # the scrape address; `application` is set by the service too.
    honor_labels: true
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 30s
