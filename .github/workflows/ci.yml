# Build and test on every push and pull request (P0-T09). Image build and push come in P9.
#
# Actions are pinned to a commit SHA (the tag is in the comment); versions checked 2026-11-24 on
# https://github.com/<action>/releases. Tests never reach Alpaca: integration tests use Testcontainers
# and, from P2, alpaca-mock (Docker is available on GitHub-hosted Linux runners).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer run for the same branch or pull request cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Temurin 25: used by the Gradle daemon (gradle/gradle-daemon-jvm.properties) and found by
      # the Java toolchain (design.md 4), so nothing is downloaded at build time.
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source cache on the GitHub Actions cache. The default "enhanced" provider is a
          # commercial service with its own terms of use.
          cache-provider: basic
          # Only main writes the cache; other branches and pull requests read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # build = compile, unit tests, ArchUnit, Spotless, Error Prone / NullAway, no-Chinese check.
      # --continue: report every failing module, not just the first one.
      - name: Build and test
        run: ./gradlew build integrationTest jacocoTestReport --continue

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: "**/build/reports/jacoco/"
          if-no-files-found: ignore
          retention-days: 14
