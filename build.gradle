// Root project: no code of its own. Shared build logic lives in build-logic/ convention plugins,
// dependency versions in gradle/libs.versions.toml and platform/.
plugins {
    id 'base'
}

// design.md 12.4: no Chinese in code (Markdown and the zh-CN language pack excepted).
// Part of `check`, so `./gradlew build` (and CI) run it.
def checkNoChinese = tasks.register('checkNoChinese', Exec) {
    group = 'verification'
    description = 'Fails if code contains Chinese characters (scripts/check-no-chinese.sh).'
    commandLine layout.projectDirectory.file('scripts/check-no-chinese.sh').asFile.absolutePath
    workingDir = layout.projectDirectory.asFile
}

tasks.named('check') {
    dependsOn checkNoChinese
}
