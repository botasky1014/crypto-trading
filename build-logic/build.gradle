// Groovy precompiled script plugins: src/main/groovy/<plugin-id>.gradle
plugins {
    id 'groovy-gradle-plugin'
}

dependencies {
    // Makes `id 'org.springframework.boot'` resolvable inside the convention plugins.
    implementation libs.spring.boot.gradle.plugin
    // Code quality plugins applied by crypto-trading.java-conventions (P0-T08).
    implementation libs.spotless.gradle.plugin
    implementation libs.errorprone.gradle.plugin
}
