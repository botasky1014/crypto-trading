// Test conventions: JUnit Platform, with two JVM Test Suites.
//   test            — fast unit tests, run by `./gradlew build`
//   integrationTest — Testcontainers-based tests, run by `./gradlew integrationTest`
// (`contractTest` is added in P5.)
plugins {
    id 'crypto-trading.java-conventions'
    id 'jvm-test-suite'
    id 'jacoco'
}

def catalog = extensions.getByType(VersionCatalogsExtension).named('libs')

def ARCHITECTURE_RULES = ':libs:architecture-rules'

testing {
    suites {
        configureEach {
            // No version given: JUnit versions come from the Spring Boot BOM via the platform.
            useJUnitJupiter()
            dependencies {
                implementation platform(project(':platform'))
                implementation 'org.assertj:assertj-core'
                compileOnly 'org.projectlombok:lombok'
                annotationProcessor platform(project(':platform'))
                annotationProcessor 'org.projectlombok:lombok'
            }
        }

        test {
            // Every module's unit tests can use the shared ArchUnit rules (design.md 11.2),
            // e.g. `class ArchitectureTest extends AbstractArchitectureTest {}`.
            if (project.path != ARCHITECTURE_RULES) {
                dependencies {
                    implementation project(ARCHITECTURE_RULES)
                }
            }
        }

        integrationTest(JvmTestSuite) {
            dependencies {
                implementation project()
            }
            targets.configureEach {
                testTask.configure {
                    shouldRunAfter(tasks.named('test'))
                }
            }
        }
    }
}

tasks.withType(Test).configureEach {
    // Memory-friendly defaults for a 16GB machine.
    maxHeapSize = '1g'
    maxParallelForks = 1
}

// Coverage: one report over all test suites that have run (test, integrationTest), so
// `./gradlew test integrationTest jacocoTestReport` gives the combined picture.
jacoco {
    toolVersion = catalog.findVersion('jacoco').get().requiredVersion
}

tasks.named('jacocoTestReport', JacocoReport).configure {
    dependsOn(tasks.named('test'))
    mustRunAfter(tasks.named('integrationTest'))
    executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec'))
    reports {
        xml.required = true
        html.required = true
    }
}
